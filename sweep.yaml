program: wandb_train.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
method: bayes
name: gb-source-counting-sweep
metric:
  name: best_val_f1
  goal: maximize
parameters:
  LEARNING_STRATEGY:
    values: ["mse+ce+or"]
  LR:
    distribution: log_uniform_values
    min: 5e-4
    max: 5e-3
  BATCH_SIZE:
    values: [2048, 4096, 8192]
  WEIGHT_DECAY:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2
  NB_EPOCHS:
    values: [100]
  MAX_K:
    values: [10]
  LAMBDA_MSE:
    distribution: log_uniform_values
    min: 50.0
    max: 200.0
  LAMBDA_CE:
    distribution: log_uniform_values
    min: 0.1
    max: 1.5
  LAMBDA_ORDINAL:
    distribution: log_uniform_values
    min: 0.02
    max: 0.1
  CHANNEL_MULTIPLIER:
    values: [1, 2]
  CONV_1_KERNEL_SIZE:
    values: [9, 7, 5, 3]
  CONV_2_KERNEL_SIZE:
    values: [9, 7, 5, 3]
  CONV_2_STRIDE:
    values: [1, 2]
  CONV_3_KERNEL_SIZE:
    values: [9, 7, 5, 3]
  CONV_4_KERNEL_SIZE:
    values: [9, 7, 5, 3]
  TRANSFORMER_NHEAD:
    values: [4, 7, 14]
  TRANSFORMER_FF_MULTIPLIER:
    values: [2, 3, 4]
  TRANSFORMER_NUM_LAYERS:
    values: [2, 3, 4]
